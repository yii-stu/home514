<!DOCTYPE html>
<html>

<head>
  <title>Simple Web AR with Hiro</title>

  <!-- 引入 A-Frame 核心程式庫，用於建立 3D 場景 -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- 引入 AR.js 擴充功能（針對 A-Frame 設計的 AR 模組） -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body>

  <!-- 2. 你的 AR 場景 -->
  <!-- 標記副檔名須為 .mind -->
  <a-scene
    mindar-image="
      imageTargetSrc: Scorpio.mind;
      autoStart: true;
      showStats: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- 設定 AR 相機位於原點，並關閉滑鼠/手勢控制（僅使用裝置鏡頭） -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 定義第 0 號圖像目標 -->
    <a-entity
      mindar-image-target="targetIndex: 0"
      id="Scorpio">
    </a-entity>

  </a-scene>

  <!-- 3. 用 JS 綁事件：掃到 target 時顯示 DIV，掉失時隱藏 -->
  <script>

    // 1. 等整個頁面載入完成
    window.addEventListener("load", () => {

      // 2. 取得 AR 目標元素
      const targetEl = document.querySelector("#target");

      // 3. 取得自訂文字容器
      const customDiv = document.querySelector("#custom-text");

      // 4. 綁定「掃描到目標」事件
      targetEl.addEventListener("targetFound", () => {

        // 顯示文字
        customDiv.style.display = "block";
      });

      // 5. 綁定「目標遺失」事件
      targetEl.addEventListener("targetLost", () => {

        // 隱藏文字
        customDiv.style.display = "none";
      });

    });

  </script>

  <!-- 放置自訂義模型 -->
  <a-entity
<a-gltf-model
src="#untitle"
position="0 0 0"
scale="0.1 0.1 0.1S"
rotation="0 0 0"
></a-gltf-model>
    ></a-entity>

  <!-- 環境光 -->
  <a-light
    type="ambient"
    intensity="0.8">
  </a-light>

  <!-- 相機元件 -->
  <a-entity camera></a-entity>

  </a-scene>

</body>

<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8" />

  <title>MindAR Example</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* 隱藏所有 MindAR 預設 UI */
    .mindar-ui-loading,
    .mindar-ui-error,
    .mindar-ui-scanning {
      display: none;
    }

  </style>

</head>

</html>
