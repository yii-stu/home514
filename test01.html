<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Test zodiac AR</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html, body {
margin: 0; padding: 0;
width: 100%; height: 100%;
overflow: hidden;
}
a-scene {
width: 100%; height: 100%;
position: fixed; top: 0; left: 0;
}
/* 隱藏所有 MindAR 預設 UI */
.mindar-ui-loading,
.mindar-ui-error,
.mindar-ui-scanning {
display: none;
}
/* 自訂文字的外層 DIV */
#custom-text {
display: none; /* 預設隱藏 */
position: fixed;
top: 20px; /* 距離頂部 20px */
left: 50%;
transform: translateX(-50%);
background: rgba(0, 0, 0, 0.6);
color: white;
padding: 0.5em 1em;
font-size: 1.5em;
border-radius: 0.3em;
z-index: 9999;
pointer-events: none;
}
</style>
</head>
<body>
<!-- 建立 AR 場景 -->
<!-- embedded: 讓 AR 畫面嵌入在頁面中（而非全螢幕） -->
<!-- sourceType: webcam 表示使用相機鏡頭作為來源 -->
<!-- debugUIEnabled: true 開啟左下角偵測狀態資訊（幫助教學觀察） -->
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;">
<!-- 使用內建 Hiro 標記作為觸發圖 -->
<a-marker preset="hiro">
<!-- 放置一個立方體（a-box）作為顯示物件 -->
<!-- position="0 0.5 0" 表示位於標記上方 0.5 單位的高度 -->
<!-- rotation="0 45 0" 表示水平旋轉 45 度 -->
<!-- color="red" 設定顏色為紅色 -->
<a-box position="0 0.5 0" rotation="0 45 0" color="red"></a-box>
<!-- 加入環境光源（ambient light） -->
<!-- 避免物件在未打光情況下顯示為黑色 -->
<a-light type="ambient" intensity="0.8"></a-light>
</a-marker>
<!-- 加入相機元件，讓 AR.js 控制鏡頭追蹤 -->
<a-entity camera></a-entity>
</a-scene>
</html>
