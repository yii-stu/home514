<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>MindAR Example</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#custom-text {
  position: fixed;
  top: 20px;
  left: 20px;
  color: white;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  display: none;
  z-index: 999;
}
</style>
</head>

<body>

<div id="custom-text">
  掃描成功！
</div>

<a-scene
  mindar-image="imageTargetSrc: Scorpio.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="Scorpio">

    <a-box
      position="0 0.5 0"
      rotation="0 45 0"
      color="red">
    </a-box>

    <a-light type="ambient" intensity="0.8"></a-light>

  </a-entity>

</a-scene>

<script>
window.addEventListener("load", () => {

  const targetEl = document.querySelector("#Scorpio");
  const customDiv = document.querySelector("#custom-text");

  targetEl.addEventListener("targetFound", () => {
    customDiv.style.display = "block";
  });

  targetEl.addEventListener("targetLost", () => {
    customDiv.style.display = "none";
  });

});
</script>

</body>
</html>
