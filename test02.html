<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Test Zodiac AR</title>
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
        <style>
            html,
            body,
            a-scene{
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <a-scene
          mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: true; uiScanning: true; uiError: true;"
          color-space="sRGB"
          embedded
          renderer="colorManagement: true, physicallyCorrectLights: true"
          vr-mode-ui="enabled: false"
          device-orientation-permission-ui="enabled: false"
        >
        <a-assets>
            <a-asset-item id="untitleModel" src="untitled.glb"></a-asset-item>
        </a-assets>
        
        <a-camera look-controls="enabled: false"></a-camera>
        <a-light type="ambient" intensity="2"></a-light>

        <a-entity mindar-image-target="targetsIndex: 0">
            <a-gltf-model
              src="#untitleModel"
              position="0 0 0"
              scale="0.1 0.1 0.1S"
              rotation="0 0 0"
              ></a-gltf-model>
        </a-entity>
        </a-scene>      
    </body>
</html>
